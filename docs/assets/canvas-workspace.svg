<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Berry AI Studio canvas workspace</title>
  <desc id="d">A stylised view of the infinite canvas: title bar, navigation rail, dotted canvas with two image cards, and the creation dock at the bottom.</desc>
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155"/>
    </pattern>
    <clipPath id="win"><rect x="0" y="0" width="1200" height="720" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="720" fill="#0f172a"/>
    <rect width="1200" height="720" fill="url(#glow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1200" height="44" fill="#0f172a"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- macOS traffic lights -->
    <circle cx="22" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="43" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6.5" fill="#28c840" stroke="#e0a92a" stroke-opacity="0.35"/>
    <circle cx="88" cy="22" r="7" fill="url(#indigo)"/>
    <text x="104" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Berry AI Studio</text>
    <rect x="212" y="13" width="38" height="18" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="231" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">0.1.1</text>

    <!-- header actions -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#cbd5e1">
      <rect x="330" y="11" width="118" height="22" rx="7" fill="#1e293b" stroke="#334155"/>
      <text x="389" y="26" text-anchor="middle">My First Artwork</text>
      <rect x="460" y="11" width="54" height="22" rx="7" fill="#0f172a" stroke="#334155"/>
      <text x="487" y="26" text-anchor="middle" fill="#4ade80">Saved</text>
      <rect x="548" y="11" width="58" height="22" rx="7" fill="#0f172a" stroke="#334155"/>
      <text x="577" y="26" text-anchor="middle">Import</text>
      <rect x="616" y="11" width="86" height="22" rx="7" fill="#0f172a" stroke="#334155"/>
      <text x="659" y="26" text-anchor="middle" fill="#a5b4fc">Model Access</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="830" cy="22" r="3" fill="#4ade80"/>
      <text x="840" y="26">Backend</text>
      <circle cx="912" cy="22" r="3" fill="#4ade80"/>
      <text x="922" y="26">Ready</text>
      <text x="1000" y="26" fill="#64748b">RTX 4060 Ti · 16 GB</text>
    </g>

    <!-- nav rail -->
    <rect x="0" y="44" width="56" height="676" fill="#0b1220"/>
    <line x1="56" y1="44" x2="56" y2="720" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="14" y="76" width="28" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5"/>
    <circle cx="28" cy="90" r="5" fill="#818cf8"/>
    <g fill="#475569">
      <rect x="20" y="130" width="16" height="16" rx="4"/>
      <rect x="20" y="172" width="16" height="16" rx="4"/>
      <rect x="20" y="214" width="16" height="16" rx="4"/>
    </g>
    <text x="28" y="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#475569" text-anchor="middle">More</text>

    <!-- canvas -->
    <rect x="56" y="44" width="1144" height="676" fill="url(#dots)"/>

    <!-- image card 1 -->
    <g>
      <rect x="150" y="140" width="300" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="150" y="140" width="300" height="220" rx="12" fill="#312e81"/>
      <path d="M150 300 L215 245 L268 288 L320 230 L450 310 L450 348 L150 348 Z" fill="#4338ca" opacity="0.85"/>
      <circle cx="392" cy="196" r="22" fill="#fbbf24" opacity="0.85"/>
      <text x="170" y="390" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" fill="#e2e8f0">Golden hour valley</text>
      <text x="170" y="408" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">1024 × 1024 · seed 88213</text>
      <rect x="170" y="418" width="66" height="14" rx="7" fill="#052e16" stroke="#166534"/>
      <text x="203" y="428" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="8" fill="#4ade80" text-anchor="middle">generated</text>
    </g>

    <!-- image card 2 (selected) -->
    <g>
      <rect x="500" y="180" width="300" height="300" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
      <rect x="500" y="180" width="300" height="220" rx="12" fill="#0c4a6e"/>
      <circle cx="650" cy="268" r="54" fill="#0284c7" opacity="0.5"/>
      <circle cx="650" cy="268" r="30" fill="#38bdf8" opacity="0.6"/>
      <text x="520" y="430" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" fill="#e2e8f0">Mountain lake at dawn</text>
      <text x="520" y="448" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">1024 × 1024 · flux-schnell</text>
      <rect x="520" y="458" width="58" height="14" rx="7" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="549" y="468" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="8" fill="#a5b4fc" text-anchor="middle">selected</text>
    </g>

    <!-- selection toolbar -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#cbd5e1">
      <rect x="536" y="132" width="228" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="556" y="153">Inpaint</text>
      <line x1="604" y1="140" x2="604" y2="158" stroke="#334155"/>
      <text x="616" y="153">Upscale</text>
      <line x1="666" y1="140" x2="666" y2="158" stroke="#334155"/>
      <text x="678" y="153">Export</text>
      <line x1="716" y1="140" x2="716" y2="158" stroke="#334155"/>
      <text x="728" y="153" fill="#f87171">Remove</text>
    </g>

    <!-- creation dock -->
    <g>
      <rect x="330" y="512" width="560" height="168" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#1e293b" stroke-width="1.5"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">
        <text x="352" y="540">Create with</text>
        <rect x="418" y="526" width="128" height="20" rx="6" fill="#020617" stroke="#334155"/>
        <text x="428" y="540" fill="#cbd5e1">ComfyUI Engine</text>
        <circle cx="532" cy="536" r="3" fill="#4ade80"/>
        <text x="558" y="540">Model</text>
        <rect x="598" y="526" width="140" height="20" rx="6" fill="#020617" stroke="#334155"/>
        <text x="608" y="540" fill="#cbd5e1">sd_xl_base_1.0</text>
      </g>
      <rect x="352" y="558" width="516" height="30" rx="8" fill="#020617" stroke="#334155"/>
      <text x="366" y="577" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#cbd5e1">A mountain lake at sunrise, soft mist, cinematic lighting</text>
      <rect x="688" y="594" width="180" height="34" rx="10" fill="url(#indigo)"/>
      <text x="778" y="616" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Generate Image</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#64748b">
        <text x="352" y="616">Ratio</text>
        <rect x="388" y="604" width="26" height="18" rx="5" fill="#312e81" stroke="#4f46e5"/>
        <text x="401" y="617" fill="#c7d2fe" text-anchor="middle">1:1</text>
        <rect x="420" y="604" width="26" height="18" rx="5" fill="#0f172a" stroke="#334155"/>
        <text x="433" y="617" text-anchor="middle">16:9</text>
        <rect x="452" y="604" width="26" height="18" rx="5" fill="#0f172a" stroke="#334155"/>
        <text x="465" y="617" text-anchor="middle">9:16</text>
        <text x="500" y="617">Models</text>
        <text x="556" y="617">Random</text>
        <text x="614" y="617">Advanced</text>
      </g>
      <text x="352" y="654" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#475569">No node wiring is required — select a card to act on it.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
