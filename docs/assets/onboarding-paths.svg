<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">First-image guide on an empty canvas</title>
  <desc id="d">The empty canvas shows one centred panel with the cloud and local-engine paths, each naming its current blocker and offering a direct action.</desc>
  <defs>
    <linearGradient id="indigo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155"/>
    </pattern>
    <clipPath id="win2"><rect x="0" y="0" width="1200" height="720" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win2)">
    <rect width="1200" height="720" fill="#0f172a"/>

    <!-- title bar -->
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- macOS traffic lights -->
    <circle cx="22" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="43" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6.5" fill="#28c840" stroke="#e0a92a" stroke-opacity="0.35"/>
    <circle cx="26" cy="22" r="7" fill="url(#indigo2)"/>
    <text x="104" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Berry AI Studio</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#cbd5e1">
      <rect x="330" y="11" width="118" height="22" rx="7" fill="#1e293b" stroke="#334155"/>
      <text x="389" y="26" text-anchor="middle">My First Artwork</text>
      <rect x="460" y="11" width="54" height="22" rx="7" fill="#0f172a" stroke="#334155"/>
      <text x="487" y="26" text-anchor="middle" fill="#4ade80">Saved</text>
    </g>

    <!-- nav rail -->
    <rect x="0" y="44" width="56" height="676" fill="#0b1220"/>
    <line x1="56" y1="44" x2="56" y2="720" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="14" y="76" width="28" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5"/>
    <circle cx="28" cy="90" r="5" fill="#818cf8"/>

    <!-- canvas -->
    <rect x="56" y="44" width="1144" height="676" fill="url(#dots2)"/>
    <rect x="56" y="44" width="1144" height="676" fill="url(#glow2)"/>

    <!-- guide panel -->
    <g>
      <rect x="300" y="96" width="600" height="322" rx="16" fill="#0f172a" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

      <!-- header -->
      <rect x="328" y="124" width="36" height="36" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.3"/>
      <g transform="translate(346,142)" fill="#a5b4fc">
        <path d="M0,-9 L2.1,-2.1 L9,0 L2.1,2.1 L0,9 L-2.1,2.1 L-9,0 L-2.1,-2.1 Z"/>
      </g>
      <text x="378" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Create your first image</text>
      <text x="378" y="157" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#94a3b8">Pick where it runs. Berry tells you what is still missing, if anything.</text>

      <!-- prompt -->
      <rect x="328" y="182" width="544" height="40" rx="10" fill="#020617" fill-opacity="0.6" stroke="#1e293b"/>
      <text x="344" y="207" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#cbd5e1">A serene mountain lake at sunrise, soft mist, cinematic lighting</text>

      <!-- cloud card -->
      <rect x="328" y="238" width="264" height="128" rx="12" fill="#020617" fill-opacity="0.4" stroke="#1e293b"/>
      <g transform="translate(344,258)" stroke="#94a3b8" stroke-width="1.4" fill="none">
        <path d="M5,12 h8 a4,4 0 0 0 0,-8 a5.5,5.5 0 0 0 -10.5,1.5 a3.2,3.2 0 0 0 2.5,6.5"/>
      </g>
      <text x="364" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Cloud</text>
      <rect x="510" y="256" width="66" height="16" rx="8" fill="#1e293b"/>
      <text x="543" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Not ready</text>
      <text x="344" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">Add an API key for a cloud</text>
      <text x="344" y="310" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">provider. No GPU needed.</text>
      <rect x="344" y="330" width="86" height="24" rx="8" fill="none" stroke="#334155"/>
      <text x="387" y="346" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Set up cloud</text>

      <!-- local card -->
      <rect x="608" y="238" width="264" height="128" rx="12" fill="#020617" fill-opacity="0.4" stroke="#1e293b"/>
      <g transform="translate(624,258)" stroke="#94a3b8" stroke-width="1.4" fill="none">
        <rect x="0" y="0" width="16" height="16" rx="2"/>
        <rect x="4.5" y="4.5" width="7" height="7" rx="1"/>
      </g>
      <text x="644" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Local engine</text>
      <rect x="790" y="256" width="66" height="16" rx="8" fill="#1e293b"/>
      <text x="823" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Not ready</text>
      <text x="624" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">ComfyUI Engine is stopped.</text>
      <text x="624" y="310" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">Start it to use it.</text>
      <rect x="624" y="330" width="82" height="24" rx="8" fill="none" stroke="#334155"/>
      <text x="665" y="346" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Start engine</text>

      <!-- footer -->
      <g transform="translate(328,386)" stroke="#475569" stroke-width="1.3" fill="none">
        <rect x="0" y="0" width="14" height="14" rx="3"/>
        <path d="M7,3 v8 M3,7 h8"/>
      </g>
      <text x="350" y="397" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#64748b">Type a prompt below and press Generate. No node wiring is required.</text>
    </g>

    <!-- creation dock -->
    <g>
      <rect x="330" y="486" width="560" height="150" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#1e293b" stroke-width="1.5"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#94a3b8">
        <text x="352" y="514">Create with</text>
        <rect x="418" y="500" width="128" height="20" rx="6" fill="#020617" stroke="#334155"/>
        <text x="428" y="514" fill="#cbd5e1">ComfyUI Engine</text>
        <text x="558" y="514">Model</text>
        <rect x="598" y="500" width="140" height="20" rx="6" fill="#020617" stroke="#334155"/>
        <text x="608" y="514" fill="#cbd5e1">Model needs validation</text>
      </g>
      <text x="352" y="538" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" fill="#fbbf24">Choose a configured cloud provider, or start an engine and validate its model.</text>
      <rect x="352" y="550" width="516" height="30" rx="8" fill="#020617" stroke="#334155"/>
      <text x="366" y="569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#64748b">A serene mountain lake at sunrise…</text>
      <rect x="688" y="588" width="180" height="32" rx="10" fill="#312e81" opacity="0.55"/>
      <text x="778" y="609" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Generate Image</text>
      <text x="352" y="602" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#475569">Generate stays disabled until one path is ready.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
