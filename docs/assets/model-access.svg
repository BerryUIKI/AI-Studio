<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Model Access console</title>
  <desc id="d">Settings shows access types and source filters on the left, a searchable provider card grid on the right, and a note that keys stay on this device.</desc>
  <defs>
    <linearGradient id="indigo3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="win3"><rect x="0" y="0" width="1200" height="720" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win3)">
    <rect width="1200" height="720" fill="#0f172a"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- macOS traffic lights -->
    <circle cx="22" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="43" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6.5" fill="#28c840" stroke="#e0a92a" stroke-opacity="0.35"/>
    <circle cx="26" cy="22" r="7" fill="url(#indigo3)"/>
    <text x="104" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Berry AI Studio</text>

    <!-- settings sidebar -->
    <rect x="0" y="44" width="260" height="676" fill="#0b1220"/>
    <line x1="260" y1="44" x2="260" y2="720" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="24" y="72" width="32" height="32" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.2"/>
    <text x="66" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Settings</text>
    <text x="66" y="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" fill="#64748b">Berry AI Studio</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11">
      <text x="60" y="146" fill="#94a3b8">General &amp; Language</text>
      <text x="60" y="184" fill="#94a3b8">AI Agent &amp; LLM</text>
      <text x="60" y="222" fill="#94a3b8">Startup &amp; Landing</text>
      <text x="60" y="260" fill="#94a3b8">Exit Policy</text>
    </g>
    <rect x="24" y="276" width="212" height="34" rx="9" fill="#312e81" stroke="#4338ca"/>
    <circle cx="42" cy="293" r="6" fill="none" stroke="#a5b4fc" stroke-width="1.3"/>
    <path d="M38 293 h8 M42 289 v8" stroke="#a5b4fc" stroke-width="1.3"/>
    <text x="60" y="297" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#e0e7ff">Model Access</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#94a3b8">
      <text x="60" y="335">Engines &amp; Hardware</text>
      <text x="60" y="373">About</text>
    </g>

    <!-- main -->
    <text x="320" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#ffffff">Model Access</text>
    <text x="320" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#94a3b8">Connect language models and image providers. Cloud keys stay on this device; local engines are optional.</text>

    <!-- left column -->
    <text x="320" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.6">ACCESS TYPE</text>
    <rect x="320" y="188" width="198" height="34" rx="9" fill="#312e81"/>
    <circle cx="338" cy="205" r="5.5" fill="none" stroke="#a5b4fc" stroke-width="1.3"/>
    <text x="352" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#e0e7ff">Language models</text>
    <rect x="320" y="228" width="198" height="34" rx="9" fill="none"/>
    <rect x="332" y="240" width="11" height="9" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M335 236 l4 -3 l4 3" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
    <text x="352" y="249" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#cbd5e1">Image models</text>
    <text x="352" y="289" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#475569">Local CLI tools</text>
    <rect x="348" y="278" width="66" height="1.5" fill="#475569" opacity="0.5"/>

    <text x="320" y="330" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.6">SOURCE</text>
    <rect x="320" y="342" width="198" height="26" rx="7" fill="#1e293b"/>
    <text x="334" y="359" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#e2e8f0">All</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#94a3b8">
      <text x="334" y="388">Official</text>
      <text x="334" y="414">Third-party relay</text>
      <text x="334" y="440">Local</text>
      <text x="334" y="466">Custom</text>
    </g>

    <!-- right column -->
    <rect x="546" y="164" width="310" height="32" rx="10" fill="#020617" stroke="#1e293b"/>
    <circle cx="566" cy="180" r="5" fill="none" stroke="#475569" stroke-width="1.3"/>
    <path d="M570 184 l4 4" stroke="#475569" stroke-width="1.3"/>
    <text x="582" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#475569">Search providers or model IDs…</text>
    <rect x="870" y="164" width="98" height="32" rx="10" fill="url(#indigo3)"/>
    <text x="919" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add custom</text>

    <text x="546" y="222" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.6">LANGUAGE MODEL PROVIDERS</text>

    <!-- provider cards -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
      <!-- row 1 -->
      <rect x="546" y="232" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="558" y="244" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="574" y="265" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">L</text>
      <text x="600" y="258" font-size="10.5" font-weight="600" fill="#e2e8f0">llama.cpp</text>
      <circle cx="662" cy="254" r="3" fill="#4ade80"/>
      <text x="600" y="273" font-size="9" fill="#64748b">Embedded</text>
      <rect x="694" y="250" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="718" y="264" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>

      <rect x="762" y="232" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="774" y="244" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="790" y="265" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">O</text>
      <text x="816" y="258" font-size="10.5" font-weight="600" fill="#e2e8f0">OpenAI</text>
      <text x="816" y="273" font-size="9" fill="#64748b">api.openai.com</text>
      <rect x="910" y="250" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="934" y="264" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>

      <!-- row 2 -->
      <rect x="546" y="296" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="558" y="308" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="574" y="329" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">D</text>
      <text x="600" y="322" font-size="10.5" font-weight="600" fill="#e2e8f0">DeepSeek</text>
      <text x="600" y="337" font-size="9" fill="#64748b">api.deepseek.com</text>
      <rect x="694" y="314" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="718" y="328" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>

      <rect x="762" y="296" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="774" y="308" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="790" y="329" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">S</text>
      <text x="816" y="322" font-size="10.5" font-weight="600" fill="#e2e8f0">SiliconFlow</text>
      <text x="816" y="337" font-size="9" fill="#64748b">api.siliconflow.cn</text>
      <rect x="910" y="314" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="934" y="328" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>

      <!-- row 3 -->
      <rect x="546" y="360" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="558" y="372" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="574" y="393" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">M</text>
      <text x="600" y="386" font-size="10.5" font-weight="600" fill="#e2e8f0">Moonshot</text>
      <text x="600" y="401" font-size="9" fill="#64748b">api.moonshot.cn</text>
      <rect x="694" y="378" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="718" y="392" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>

      <rect x="762" y="360" width="206" height="56" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <rect x="774" y="372" width="32" height="32" rx="8" fill="#020617" stroke="#334155"/>
      <text x="790" y="393" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Z</text>
      <text x="816" y="386" font-size="10.5" font-weight="600" fill="#e2e8f0">Zhipu GLM</text>
      <text x="816" y="401" font-size="9" fill="#64748b">open.bigmodel.cn</text>
      <rect x="910" y="378" width="48" height="20" rx="6" fill="none" stroke="#334155"/>
      <text x="934" y="392" font-size="9" fill="#cbd5e1" text-anchor="middle">Config</text>
    </g>

    <!-- storage notice -->
    <rect x="546" y="440" width="422" height="58" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <path d="M566 462 a4,4 0 1 1 8 0 v4 a4,4 0 0 1 -8 0 z" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="584" y="460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" fill="#64748b">API keys are stored on this device only. A connection test</text>
    <text x="584" y="475" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" fill="#64748b">proves reachability, not billing, model access or output quality.</text>

    <!-- editor dialog -->
    <rect x="400" y="530" width="400" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="422" y="558" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">fal.ai</text>
    <text x="776" y="558" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">×</text>

    <text x="422" y="582" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" fill="#cbd5e1">API base URL</text>
    <rect x="422" y="588" width="356" height="24" rx="7" fill="#020617" stroke="#334155"/>
    <text x="434" y="604" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">https://fal.run</text>

    <text x="422" y="630" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" fill="#cbd5e1">Model ID</text>
    <rect x="422" y="636" width="356" height="24" rx="7" fill="#020617" stroke="#334155"/>
    <text x="434" y="652" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">fal-ai/flux/schnell</text>

    <rect x="624" y="672" width="72" height="24" rx="8" fill="none" stroke="#334155"/>
    <text x="660" y="688" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Test</text>
    <rect x="704" y="672" width="74" height="24" rx="8" fill="url(#indigo3)"/>
    <text x="741" y="688" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">Save</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
