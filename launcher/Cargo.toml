[package]
name = "berry"
version = "0.1.0"
edition = "2021"
authors = ["Berry AI Studio Team"]
description = "Launcher and Environment Manager for Berry AI Studio"

[[bin]]
name = "berry"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

