[package]
name = "berry-ai-studio"
version = "0.1.0"
description = "Berry AI Studio Desktop Application"
authors = ["Berry AI Studio Team"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "berry-app"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
ureq = { version = "3.4", features = ["json"] }

