[package]
name = "berry-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared ownership-aware backend lifecycle for Berry desktop entry points"

[dependencies]
ureq = { version = "3.4", features = ["json"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
