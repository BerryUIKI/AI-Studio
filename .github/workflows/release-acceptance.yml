name: Release Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Current-head Release Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve acceptance evidence for this exact candidate
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {resolveReference, validateSource} = require('./scripts/release-evidence-source.cjs');
            const reference = resolveReference(pr.body || '');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: reference.run_id,
            });
            validateSource(run, pr.head.sha, `${context.repo.owner}/${context.repo.repo}`);
            core.setOutput('run_id', String(reference.run_id));
            core.setOutput('artifact', reference.artifact);
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download external acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .acceptance-evidence
      - name: Require live and packaged acceptance records
        env:
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python scripts/verify-release-evidence.py --evidence .acceptance-evidence/evidence.json --commit "$TESTED_COMMIT"
